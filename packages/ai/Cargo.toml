[workspace]
members = ["crates/engine", "crates/agents", "crates/benchmark", "crates/server"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
tetraboard-ai-engine = { path = "crates/engine" }
tetraboard-ai-agents = { path = "crates/agents" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "=0.9.2", default-features = false }
rand_chacha = "=0.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
