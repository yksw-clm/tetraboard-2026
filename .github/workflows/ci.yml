name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run --cwd apps/web build
      - run: bun run --cwd apps/worker deploy:dry-run
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: web-${{ github.sha }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        suite: [ui-1, ui-2, ui-3, ui-4, ui-5, ui-6, worker]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Bun archive support
        run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Run UI shard
        if: matrix.suite != 'worker'
        env:
          BROWSER_SUITE: ${{ matrix.suite }}
        run: bun run --cwd apps/web test:browser --shard="${BROWSER_SUITE#ui-}/6"
      - run: bun run --cwd apps/web test:browser:worker
        if: matrix.suite == 'worker'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report-${{ github.sha }}-${{ matrix.suite }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/playwright-report-worker
            apps/web/test-results-worker
          retention-days: 7

  deploy:
    needs: [checks, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      PRODUCTION_URL: https://tetraboard.net
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-${{ github.sha }}
          path: apps/web/dist
      - name: Check main before migrations
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Newer main commit exists; skipping this deployment.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Apply migrations and deploy production
        if: steps.current.outputs.deploy == 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set repository secret CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set repository secret CLOUDFLARE_ACCOUNT_ID}"
          bun run --cwd apps/worker db:migrate:production
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo 'Main changed during migrations; skipping Worker deployment.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bun run --cwd apps/worker deploy
          echo 'deployed=true' >> "$GITHUB_OUTPUT"
      - name: Verify production
        if: steps.publish.outputs.deployed == 'true'
        run: bun scripts/checkDeployment.ts "$PRODUCTION_URL"
