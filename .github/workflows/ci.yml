name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Check (180-second target)
        run: |
          started=$(date +%s)
          status=0
          bun run check || status=$?
          elapsed=$(( $(date +%s) - started ))
          echo "bun run check: ${elapsed}s / 180s target" >> "$GITHUB_STEP_SUMMARY"
          echo "CHECK_DURATION_SECONDS=${elapsed}"
          if [ "$elapsed" -gt 180 ]; then
            echo "::warning::bun run check exceeded the 180-second target (${elapsed}s). Review duplicate tests and type checks."
          fi
          exit "$status"
      - run: bun run build
      - run: bun run --cwd apps/worker deploy:dry-run
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: web-${{ github.sha }}
          path: apps/worker/dist/assets
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: [checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      PRODUCTION_URL: https://tetraboard.net
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-${{ github.sha }}
          path: apps/worker/dist/assets
      - name: Check main before migrations
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Newer main commit exists; skipping this deployment.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Apply migrations and deploy production
        if: steps.current.outputs.deploy == 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set repository secret CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set repository secret CLOUDFLARE_ACCOUNT_ID}"
          bun run --cwd apps/worker db:migrate:production
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo 'Main changed during migrations; skipping Worker deployment.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bun run --cwd apps/worker deploy
          echo 'deployed=true' >> "$GITHUB_OUTPUT"
      - name: Verify production
        if: steps.publish.outputs.deployed == 'true'
        run: bun scripts/checkDeployment.ts "$PRODUCTION_URL"
