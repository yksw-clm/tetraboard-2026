name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-checks-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      full-validated: ${{ steps.full.outputs.validated }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Select validation scope
        id: plan
        run: bun scripts/ci/plan.ts
      - name: Verify isolation without development settings
        if: steps.plan.outputs.mode == 'full'
        env:
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
          CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
          TETRABOARD_PROCESS_ENV_LEAK: must-not-be-loaded
        run: |
          bun run --cwd apps/worker cf-typegen
          cp apps/worker/worker-configuration.d.ts "$RUNNER_TEMP/worker-configuration.clean.d.ts"
          bun run --cwd apps/worker test test/testEnvironment.test.ts
      - name: Verify isolation with conflicting dotenv settings
        if: steps.plan.outputs.mode == 'full'
        env:
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
          CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
          TETRABOARD_PROCESS_ENV_LEAK: must-not-be-loaded
        run: |
          cat > apps/worker/.env <<'VARS'
          APP_ORIGIN=https://dotenv-settings.example.invalid
          ADMIN_ACCOUNT_IDS=invalid-json
          TETRABOARD_DOT_ENV_LEAK=must-not-be-loaded
          VARS
          bun run --cwd apps/worker cf-typegen
          diff -u "$RUNNER_TEMP/worker-configuration.clean.d.ts" apps/worker/worker-configuration.d.ts
          bun run --cwd apps/worker test test/testEnvironment.test.ts
      - name: Add conflicting development settings for isolation checks
        if: steps.plan.outputs.mode == 'full'
        run: |
          cat > apps/worker/.dev.vars <<'VARS'
          APP_ORIGIN=https://personal-settings.example.invalid
          ADMIN_ACCOUNT_ID=personal-admin
          ADMIN_ACCOUNT_IDS='["personal-admin"]'
          MODERATOR_TOKEN=personal-moderator-token
          FEEDBACK_HASH_SECRET=personal-feedback-secret-at-least-32-characters
          BETTER_AUTH_SECRET=personal-auth-secret-at-least-32-characters
          GOOGLE_CLIENT_ID=personal-google
          GOOGLE_CLIENT_SECRET=personal-google-secret
          DISCORD_CLIENT_ID=personal-discord
          DISCORD_CLIENT_SECRET=personal-discord-secret
          TETRABOARD_DEV_VARS_LEAK=must-not-be-loaded
          VARS
      - name: Validate selected scope (Fast or Full)
        env:
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
          CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
          TETRABOARD_PROCESS_ENV_LEAK: must-not-be-loaded
        run: bun scripts/ci/run.ts check
      - name: Verify generated types with conflicting development settings
        if: steps.plan.outputs.mode == 'full'
        run: diff -u "$RUNNER_TEMP/worker-configuration.clean.d.ts" apps/worker/worker-configuration.d.ts
      - name: Build selected apps (types already checked)
        run: bun scripts/ci/run.ts build
      - name: Package and verify production assets
        if: steps.plan.outputs.mode == 'full'
        run: |
          bun scripts/buildAssets.ts
          bun run --cwd apps/worker deploy:dry-run
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: web-production-${{ github.sha }}
          path: apps/worker/dist/assets
          if-no-files-found: error
          retention-days: 7
      - name: Build and verify development assets
        if: steps.plan.outputs.mode == 'full'
        env:
          VITE_PUBLIC_ORIGIN: https://tetraboard-dev.chaossi-lab.workers.dev
          VITE_SEARCH_INDEXABLE: "false"
        run: |
          bun run --cwd apps/web build:assets
          bun run --cwd apps/admin build:assets
          bun scripts/buildAssets.ts
          bun run --cwd apps/worker deploy:dry-run:development
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        with:
          name: web-development-${{ github.sha }}
          path: apps/worker/dist/assets
          if-no-files-found: error
          retention-days: 7

      - name: Confirm Full CI gate
        id: full
        if: steps.plan.outputs.mode == 'full'
        run: echo 'validated=true' >> "$GITHUB_OUTPUT"

  benchmark:
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'ci-benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Compare on the same runner
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun scripts/ci/benchmark.ts "$BASE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-benchmark-${{ github.sha }}
          path: .ci-benchmark.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: [checks]
    if: needs.checks.outputs.full-validated == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref_name == 'main' && 'production-deploy' || 'development-deploy' }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      DEPLOY_URL: ${{ github.ref_name == 'main' && 'https://tetraboard.net' || 'https://tetraboard-dev.chaossi-lab.workers.dev' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-${{ env.DEPLOY_ENV }}-${{ github.sha }}
          path: apps/worker/dist/assets
      - name: Check branch before migrations
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Newer branch commit exists; skipping this deployment.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Apply migrations and deploy environment
        if: steps.current.outputs.deploy == 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set repository secret CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set repository secret CLOUDFLARE_ACCOUNT_ID}"
          bun run --cwd apps/worker "db:migrate:$DEPLOY_ENV"
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo 'Branch changed during migrations; skipping Worker deployment.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$DEPLOY_ENV" = production ]; then
            bun run --cwd apps/worker deploy
          else
            bun run --cwd apps/worker deploy:development
          fi
          echo 'deployed=true' >> "$GITHUB_OUTPUT"
      - name: Verify deployment
        if: steps.publish.outputs.deployed == 'true'
        run: bun scripts/checkDeployment.ts "$DEPLOY_URL" "$DEPLOY_ENV"
