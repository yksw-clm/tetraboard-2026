name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions: {}

jobs:
  checks:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-checks-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      ai: ${{ steps.changes.outputs.ai }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
      - run: bun install --frozen-lockfile
      - name: Detect AI changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          token: ""
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          filters: |
            ai:
              - 'packages/ai/**'
              - 'packages/four-reversi/**'
              - 'packages/four-shogi/**'
              - 'packages/reversi/**'
              - 'packages/shogi/**'
              - 'packages/protocol/**'
              - 'apps/worker/test-ai-service/**'
              - 'apps/worker/vitest.ai-service.config.mts'
              - 'apps/worker/vitest.config.mts'
              - 'apps/worker/src/rooms/**'
              - 'apps/worker/src/matchmaking/**'
              - 'apps/worker/src/accounts/matchDataContracts.ts'
              - 'apps/worker/test/roomBoundaryFixtures.ts'
              - 'apps/worker/test/accountFixtures.ts'
              - 'apps/worker/test/acceptedGameRequest.ts'
              - 'mise.toml'
              - 'bun.lock'
              - '.github/workflows/**'
      - name: Verify isolation without development settings
        env:
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
          CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
          TETRABOARD_PROCESS_ENV_LEAK: must-not-be-loaded
        run: |
          bun run --cwd apps/worker cf-typegen
          cp apps/worker/worker-configuration.d.ts "$RUNNER_TEMP/worker-configuration.clean.d.ts"
          bun run --cwd apps/worker test test/testEnvironment.test.ts
      - name: Verify isolation with conflicting dotenv settings
        env:
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
          CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
          TETRABOARD_PROCESS_ENV_LEAK: must-not-be-loaded
        run: |
          cat > apps/worker/.env <<'VARS'
          APP_ORIGIN=https://dotenv-settings.example.invalid
          ADMIN_ACCOUNT_IDS=invalid-json
          TETRABOARD_DOT_ENV_LEAK=must-not-be-loaded
          VARS
          bun run --cwd apps/worker cf-typegen
          diff -u "$RUNNER_TEMP/worker-configuration.clean.d.ts" apps/worker/worker-configuration.d.ts
          bun run --cwd apps/worker test test/testEnvironment.test.ts
      - name: Add conflicting development settings for isolation checks
        run: |
          cat > apps/worker/.dev.vars <<'VARS'
          APP_ORIGIN=https://personal-settings.example.invalid
          ADMIN_ACCOUNT_IDS='["personal-admin"]'
          MODERATOR_TOKEN=personal-moderator-token
          FEEDBACK_HASH_SECRET=personal-feedback-secret-at-least-32-characters
          BETTER_AUTH_SECRET=personal-auth-secret-at-least-32-characters
          GOOGLE_CLIENT_ID=personal-google
          GOOGLE_CLIENT_SECRET=personal-google-secret
          DISCORD_CLIENT_ID=personal-discord
          DISCORD_CLIENT_SECRET=personal-discord-secret
          TETRABOARD_DEV_VARS_LEAK=must-not-be-loaded
          VARS
      - name: Validate non-AI workspaces
        env:
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
          CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
          TETRABOARD_PROCESS_ENV_LEAK: must-not-be-loaded
        run: bun scripts/ci/run.ts check
      - name: Verify generated types with conflicting development settings
        run: diff -u "$RUNNER_TEMP/worker-configuration.clean.d.ts" apps/worker/worker-configuration.d.ts
      - name: Build apps (types already checked)
        run: bun scripts/ci/run.ts build
      - name: Package and verify production assets
        run: |
          bun scripts/buildAssets.ts
          bun run --cwd apps/worker deploy:dry-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: web-production-${{ github.sha }}
          path: apps/worker/dist/assets
          if-no-files-found: error
          retention-days: 7
      - name: Build and verify development assets
        env:
          VITE_PUBLIC_ORIGIN: https://tetraboard-dev.chaossi-lab.workers.dev
          VITE_SEARCH_INDEXABLE: "false"
        run: |
          bun run --cwd apps/web build:assets
          bun run --cwd apps/admin build:assets
          bun scripts/buildAssets.ts
          bun run --cwd apps/worker deploy:dry-run:development
          bun run --cwd packages/ai deploy:cloud:dry-run:development
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        with:
          name: web-development-${{ github.sha }}
          path: apps/worker/dist/assets
          if-no-files-found: error
          retention-days: 7

  ai:
    needs: checks
    if: needs.checks.outputs.ai == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
      - run: bun install --frozen-lockfile
      - run: bun run check:ai
      - name: Build and verify four production AI containers
        run: bun run --cwd packages/ai verify:images
      - name: Verify production AI deployment dry-run
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bun run --cwd packages/ai deploy:cloud:dry-run:production

  deploy:
    needs: [checks, ai]
    if: ${{ !cancelled() && needs.checks.result == 'success' && (needs.ai.result == 'success' || needs.ai.result == 'skipped') && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref_name == 'main' && 'production-deploy' || 'development-deploy' }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      DEPLOY_URL: ${{ github.ref_name == 'main' && 'https://tetraboard.net' || 'https://tetraboard-dev.chaossi-lab.workers.dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-${{ env.DEPLOY_ENV }}-${{ github.sha }}
          path: apps/worker/dist/assets
      - name: Check branch before migrations
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Newer branch commit exists; skipping this deployment.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy and verify production AI before the application
        if: steps.current.outputs.deploy == 'true' && env.DEPLOY_ENV == 'production' && needs.checks.outputs.ai == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_SERVICE_TOKEN: ${{ secrets.AI_SERVICE_TOKEN_PRODUCTION }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set repository secret CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set repository secret CLOUDFLARE_ACCOUNT_ID}"
          : "${AI_SERVICE_TOKEN:?Set repository secret AI_SERVICE_TOKEN_PRODUCTION}"
          bun run --cwd packages/ai deploy:cloud:production
          bun run --cwd packages/ai verify:deployment production
      - name: Apply migrations and deploy environment
        if: steps.current.outputs.deploy == 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set repository secret CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set repository secret CLOUDFLARE_ACCOUNT_ID}"
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo 'Branch changed before migrations; skipping application deployment.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bun run --cwd apps/worker "db:migrate:$DEPLOY_ENV"
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo 'Branch changed during migrations; skipping Worker deployment.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$DEPLOY_ENV" = production ]; then
            bun run --cwd apps/worker deploy
          else
            bun run --cwd apps/worker deploy:development
          fi
          echo 'deployed=true' >> "$GITHUB_OUTPUT"
      - name: Verify deployment
        if: steps.publish.outputs.deployed == 'true'
        run: bun scripts/checkDeployment.ts "$DEPLOY_URL" "$DEPLOY_ENV"
