name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Verify isolation without development settings
        env:
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
          CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
          TETRABOARD_PROCESS_ENV_LEAK: must-not-be-loaded
        run: |
          bun run --cwd apps/worker cf-typegen
          cp apps/worker/worker-configuration.d.ts "$RUNNER_TEMP/worker-configuration.clean.d.ts"
          bun run --cwd apps/worker test test/testEnvironment.test.ts
      - name: Verify isolation with conflicting dotenv settings
        env:
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
          CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
          TETRABOARD_PROCESS_ENV_LEAK: must-not-be-loaded
        run: |
          cat > apps/worker/.env <<'VARS'
          APP_ORIGIN=https://dotenv-settings.example.invalid
          ADMIN_ACCOUNT_IDS=invalid-json
          TETRABOARD_DOT_ENV_LEAK=must-not-be-loaded
          VARS
          bun run --cwd apps/worker cf-typegen
          diff -u "$RUNNER_TEMP/worker-configuration.clean.d.ts" apps/worker/worker-configuration.d.ts
          bun run --cwd apps/worker test test/testEnvironment.test.ts
      - name: Add conflicting development settings for isolation checks
        run: |
          cat > apps/worker/.dev.vars <<'VARS'
          APP_ORIGIN=https://personal-settings.example.invalid
          ADMIN_ACCOUNT_ID=personal-admin
          ADMIN_ACCOUNT_IDS='["personal-admin"]'
          MODERATOR_TOKEN=personal-moderator-token
          FEEDBACK_HASH_SECRET=personal-feedback-secret-at-least-32-characters
          BETTER_AUTH_SECRET=personal-auth-secret-at-least-32-characters
          GOOGLE_CLIENT_ID=personal-google
          GOOGLE_CLIENT_SECRET=personal-google-secret
          DISCORD_CLIENT_ID=personal-discord
          DISCORD_CLIENT_SECRET=personal-discord-secret
          TETRABOARD_DEV_VARS_LEAK=must-not-be-loaded
          VARS
      - name: Check (180-second target)
        env:
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
          CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
          TETRABOARD_PROCESS_ENV_LEAK: must-not-be-loaded
        run: |
          started=$(date +%s)
          status=0
          bun run check || status=$?
          elapsed=$(( $(date +%s) - started ))
          echo "bun run check: ${elapsed}s / 180s target" >> "$GITHUB_STEP_SUMMARY"
          echo "CHECK_DURATION_SECONDS=${elapsed}"
          if [ "$elapsed" -gt 180 ]; then
            echo "::warning::bun run check exceeded the 180-second target (${elapsed}s). Review duplicate tests and type checks."
          fi
          exit "$status"
      - name: Verify generated types with conflicting development settings
        run: diff -u "$RUNNER_TEMP/worker-configuration.clean.d.ts" apps/worker/worker-configuration.d.ts
      - run: bun run build
      - run: bun run --cwd apps/worker deploy:dry-run
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: web-${{ github.sha }}
          path: apps/worker/dist/assets
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: [checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      PRODUCTION_URL: https://tetraboard.net
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-${{ github.sha }}
          path: apps/worker/dist/assets
      - name: Check main before migrations
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Newer main commit exists; skipping this deployment.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Apply migrations and deploy production
        if: steps.current.outputs.deploy == 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set repository secret CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set repository secret CLOUDFLARE_ACCOUNT_ID}"
          bun run --cwd apps/worker db:migrate:production
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo 'Main changed during migrations; skipping Worker deployment.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bun run --cwd apps/worker deploy
          echo 'deployed=true' >> "$GITHUB_OUTPUT"
      - name: Verify production
        if: steps.publish.outputs.deployed == 'true'
        run: bun scripts/checkDeployment.ts "$PRODUCTION_URL"
