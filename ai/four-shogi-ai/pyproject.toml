[project]
name = "tetraboard-four-shogi-ai"
version = "0.1.0"
description = "TetraBoard四人将棋AIの独立Python実装"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "four_shogi_ai"

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "hypothesis"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
